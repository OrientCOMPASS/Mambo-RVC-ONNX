name: Build DLL

on:
  push:


jobs:
  build:
    name: 构建 DLL
    runs-on: windows-latest # 必须在 Windows 环境下才能编译出 .dll 动态链接库

    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v6 # 使用最新的 v6 版本

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖 (加快后续构建速度)
        uses: Swatinem/rust-cache@v2

      - name: 执行 Release 构建
        # 根据项目要求，使用 --release 构建，产物会输出在 target/release/ 目录下
        run: cargo build --release

      - name: 上传 DLL 到构建产物 (Artifacts)
        uses: actions/upload-artifact@v7 # 使用最新的 v7 版本
        with:
          name: mambo_rvc_onnx_dll
          path: target/release/mambo_rvc_onnx.dll
          archive: false # v7 新特性：不打包成 zip，直接上传单文件，下载时直接获得 dll
