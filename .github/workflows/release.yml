name: Release

# 打 v* 标签时：构建 dll → 组装完整插件包（含 3 个 ORT dll + 3 个模型 + panel.html）→ 发布 Release
# CUDA/cuDNN 的 19 个运行库**不再打进包**，由用户在面板「CUDA 运行库」卡片一键拉取（国内镜像）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      models_url:
        description: '模型 zip 的 URL（须含 hubert_base.onnx / rmvpe.onnx / uma-Matikane_Tannhauser.onnx；留空 = 复用 v1.1.0 Release 包内的 models/）'
        required: false
        default: ''

env:
  # ONNX Runtime：必须用 GitHub Release 的 cuda12 专用包（PyPI 的 onnxruntime-gpu 1.27+ 已切 CUDA 13）。
  # 1.27.1 = 与面板拉取的 CUDA 12.9 / cuDNN 9.25 运行库组合经过实测。
  ORT_ZIP_URL: https://github.com/microsoft/onnxruntime/releases/download/v1.27.1/onnxruntime-win-x64-gpu_cuda12-1.27.1.zip
  ORT_ZIP_NAME: onnxruntime-win-x64-gpu_cuda12-1.27.1.zip
  ORT_ZIP_ROOT: onnxruntime-win-x64-gpu_cuda12-1.27.1
  # 模型不在仓库里（体积太大），默认复用上一个带模型的 Release 包
  MODELS_FALLBACK_URL: https://github.com/OrientCOMPASS/Mambo-RVC-ONNX/releases/download/v1.1.0/opss.mambo-rvc-onnx.zip
  PLUGIN_ZIP: opss.mambo-rvc-onnx.zip

jobs:
  release:
    name: 构建并发布 Release
    runs-on: windows-latest
    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v6

      - name: 校验版本号一致（tag / plugin.json / Cargo.toml）
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -notlike "refs/tags/*") { Write-Host "非 tag 触发，跳过版本校验"; exit 0 }
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $pj = (Get-Content plugin.json -Raw | ConvertFrom-Json).version
          $ct = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $pj -or $tag -ne $ct) {
            Write-Error "版本不一致: tag=$tag plugin.json=$pj Cargo.toml=$ct"
            exit 1
          }
          Write-Host "版本一致: $tag"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 单元测试
        run: cargo test --release

      - name: 执行 Release 构建
        run: cargo build --release

      - name: 配置 MSVC 环境（dumpbin）
        uses: ilammy/msvc-dev-cmd@v1

      - name: 校验 ABI 导出符号
        shell: pwsh
        run: |
          $exports = dumpbin /exports target/release/mambo_rvc_onnx.dll | Out-String
          $need = @('micyou_plugin_info','micyou_plugin_init','micyou_plugin_deinit',
                    'micyou_plugin_process','micyou_plugin_handle_event','micyou_plugin_handle_message')
          $missing = $need | Where-Object { $exports -notmatch $_ }
          if ($missing) { Write-Error "缺少导出符号: $missing"; exit 1 }
          Write-Host "ABI 导出符号齐全 ($($need.Count))"

      - name: 缓存 ONNX Runtime cuda12 包
        uses: actions/cache@v4
        with:
          path: ${{ env.ORT_ZIP_NAME }}
          key: ort-${{ env.ORT_ZIP_NAME }}

      - name: 下载 ONNX Runtime（缓存未命中时）
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.ORT_ZIP_NAME }}")) {
            curl.exe -L --retry 3 -o "${{ env.ORT_ZIP_NAME }}" "${{ env.ORT_ZIP_URL }}"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          (Get-Item "${{ env.ORT_ZIP_NAME }}").Length

      - name: 下载模型包（Release 之间同源，不做缓存以保证自定义 URL 的正确性）
        shell: pwsh
        run: |
          $url = "${{ github.event.inputs.models_url }}"
          if (-not $url) { $url = "${{ env.MODELS_FALLBACK_URL }}" }
          Write-Host "models url: $url"
          curl.exe -L --retry 3 -o models_src.zip $url
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-Item models_src.zip).Length

      - name: 组装发布目录
        shell: pwsh
        run: |
          $stage = "stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$stage/libs", "$stage/models" | Out-Null

          # 1) 插件本体
          Copy-Item target/release/mambo_rvc_onnx.dll "$stage/mambo_rvc_onnx.dll"
          Copy-Item plugin.json, panel.html, README.md, LICENSE $stage

          # 2) libs/：从 ORT cuda12 官方包取 3 个 dll（不含 tensorrt provider）
          tar -xf "${{ env.ORT_ZIP_NAME }}" -C . "${{ env.ORT_ZIP_ROOT }}/lib/onnxruntime.dll" `
              "${{ env.ORT_ZIP_ROOT }}/lib/onnxruntime_providers_cuda.dll" `
              "${{ env.ORT_ZIP_ROOT }}/lib/onnxruntime_providers_shared.dll"
          Copy-Item "${{ env.ORT_ZIP_ROOT }}/lib/onnxruntime.dll" "$stage/libs/"
          Copy-Item "${{ env.ORT_ZIP_ROOT }}/lib/onnxruntime_providers_cuda.dll" "$stage/libs/"
          Copy-Item "${{ env.ORT_ZIP_ROOT }}/lib/onnxruntime_providers_shared.dll" "$stage/libs/"
          Remove-Item -Recurse -Force "${{ env.ORT_ZIP_ROOT }}"

          # 3) models/：解出 3 个 onnx（兼容包内带 models/ 前缀或直接是 onnx 两种布局）
          $tmp = "models_tmp"
          New-Item -ItemType Directory $tmp -Force | Out-Null
          tar -xf models_src.zip -C $tmp
          if ($LASTEXITCODE -ne 0) { Write-Error "模型包解压失败"; exit 1 }
          $onnx = Get-ChildItem -Recurse $tmp -Filter *.onnx
          foreach ($f in $onnx) { Copy-Item $f.FullName "$stage/models/" }
          Remove-Item -Recurse -Force $tmp
          $need = @('hubert_base.onnx','rmvpe.onnx','uma-Matikane_Tannhauser.onnx')
          $missing = $need | Where-Object { -not (Test-Path "$stage/models/$_") }
          if ($missing) { Write-Error "模型缺失: $missing"; exit 1 }

          # 4) 校验 libs/ 三件套齐全
          $libs = Get-ChildItem "$stage/libs" -Filter *.dll | Select-Object -ExpandProperty Name
          Write-Host "libs/: $libs"
          if ($libs.Count -ne 3) { Write-Error "libs/ 应为 3 个 dll，实际 $($libs.Count)"; exit 1 }

      - name: 打包 zip
        shell: pwsh
        run: |
          # bsdtar 按扩展名生成 zip；根目录直接含 plugin.json（宿主导入要求）
          tar -a -cf "${{ env.PLUGIN_ZIP }}" -C stage plugin.json panel.html README.md LICENSE mambo_rvc_onnx.dll libs models
          $z = Get-Item "${{ env.PLUGIN_ZIP }}"
          Write-Host ("zip: {0:N0} bytes" -f $z.Length)
          if ($z.Length -lt 500MB) { Write-Error "zip 体积异常（小于 500MB），模型可能没打进去"; exit 1 }

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ env.PLUGIN_ZIP }}" plugin.json `
            --title "${{ github.ref_name }}" --generate-notes
          Write-Host "已发布 ${{ github.ref_name }}：${{ env.PLUGIN_ZIP }} + plugin.json（updateUrl 资产）"
