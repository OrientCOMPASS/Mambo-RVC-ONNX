name: Build & Release

# 操作手册（参考 Focus-Capture 的构建方式）：
#   * push 到 main / dev（任何提交）→ 仅自动构建 development build：
#     Windows 编译 + 单测 + ABI 检查，然后从本仓库 `resources` Release 拉取
#     libs.zip（3 个 ORT dll）与 models.zip（3 个模型），组装成完整插件包，
#     作为 Actions artifact（mambo-rvc-onnx-development，根目录即包内容，
#     下载解压后可直接导入），**绝不创建 release / tag**。
#   * 发 release：Actions 页面 → Run workflow（workflow_dispatch），
#     可选 bump 档位（none/patch/minor/major，默认 none = 用 main 上
#     plugin.json 的当前版本）。流程：构建 → 组装 → 打 tag v<ver> →
#     创建 Release（资产：plugin.zip 主包（固定名，不带版本号）+ plugin.json
#     （与 zip 内 manifest 同一份，供手动市场 PR 与更新检查）；plugin.json 的
#     downloadUrl 在仓库 manifest 里固定指向 releases/latest/download/plugin.zip，
#     CI 只校验不回写）。
#     若选择 bump 档位，新版本号（plugin.json + Cargo.toml，二者必须同步，
#     因为 dll 内嵌 CARGO_PKG_VERSION）会在打包前写好，发布后回提交到 main
#     （提交信息带 [skip ci]）。
#   * 同一版本重复发 release 会在第一个 job 就直接失败（tag 已存在），防止误覆盖。
#   * 提交信息含 [skip ci] → 整个 workflow 跳过（GitHub 原生支持）。
#   * 运行库资源：`resources` Release 的 libs.zip / models.zip（更新资源 =
#     重新上传同名资产即可，workflow 每次实时拉取，不做缓存）。
#     CUDA/cuDNN 的 19 个运行库不在包里，由用户在面板一键拉取（src/fetch.rs）。

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release 版本档位：none = 使用 main 上 plugin.json 当前版本"
        type: choice
        default: none
        options: [none, patch, minor, major]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RESOURCES_BASE: https://github.com/OrientCOMPASS/Mambo-RVC-ONNX/releases/download/resources
  PLUGIN_ID: opss.mambo-rvc-onnx

jobs:
  # ── 版本号裁决（快速失败：版本漂移 / 重复发布都在烧 Windows 分钟之前拦下）──
  prepare:
    name: 版本号与预检
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      bumped: ${{ steps.ver.outputs.bumped }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: 决定版本号（bump 档位；校验 plugin.json 与 Cargo.toml 一致）
        id: ver
        run: |
          python3 - <<'PY'
          import json, os, re
          bump = os.environ.get('BUMP') or 'none'
          m = json.load(open('plugin.json', encoding='utf-8'))
          cargo = open('Cargo.toml', encoding='utf-8').read()
          cm = re.search(r'^version = "([^"]+)"', cargo, re.M)
          if not cm:
              raise SystemExit('Cargo.toml 里找不到 package version')
          if cm.group(1) != m['version']:
              raise SystemExit(f"版本漂移: plugin.json={m['version']} Cargo.toml={cm.group(1)}，请先同步")
          maj, mi, pa = (int(x) for x in m['version'].split('.')[:3])
          if bump == 'patch':
              pa += 1
          elif bump == 'minor':
              mi += 1; pa = 0
          elif bump == 'major':
              maj += 1; mi = 0; pa = 0
          elif bump != 'none':
              raise SystemExit(f'未知 bump 档位: {bump}')
          ver = f'{maj}.{mi}.{pa}'
          bumped = bump != 'none'
          if bumped:
              # 打包前就把新版本写进 plugin.json + Cargo.toml ⇒
              # dll 内嵌的 CARGO_PKG_VERSION、manifest、tag 三者一致
              m['version'] = ver
              with open('plugin.json', 'w', encoding='utf-8') as f:
                  json.dump(m, f, ensure_ascii=False, indent=2)
                  f.write('\n')
              cargo = re.sub(r'^version = "[^"]+"', f'version = "{ver}"', cargo, count=1, flags=re.M)
              open('Cargo.toml', 'w', encoding='utf-8').write(cargo)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={ver}\n')
              f.write(f"bumped={'true' if bumped else 'false'}\n")
          print('release version:', ver, f'(bump={bump})')
          PY
        env:
          BUMP: ${{ github.event.inputs.bump }}

      - name: 防止重复发布同版本（仅手动 release）
        if: github.event_name == 'workflow_dispatch'
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::release v${{ steps.ver.outputs.version }} 已存在；请在 main 修改 plugin.json 版本或选择 bump 档位"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 上传版本化清单（plugin.json + Cargo.toml）
        uses: actions/upload-artifact@v7
        with:
          name: versioned-files
          path: |
            plugin.json
            Cargo.toml

  # ── Windows 构建（唯一的编译矩阵：本插件仅 windows x86_64）──
  build:
    name: 构建 windows-x86_64
    needs: [prepare]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: 应用版本化清单（bump 时为新版本；push 时与仓库一致）
        uses: actions/download-artifact@v7
        with:
          name: versioned-files
          path: versioned

      - name: 覆盖工作区清单（须在 cargo build 之前，dll 内嵌 CARGO_PKG_VERSION）
        shell: bash
        run: |
          cp versioned/plugin.json plugin.json
          cp versioned/Cargo.toml Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 单元测试
        run: cargo test --release

      - name: Release 构建
        run: cargo build --release

      - name: 配置 MSVC 环境（dumpbin）
        uses: ilammy/msvc-dev-cmd@v1

      - name: 校验 ABI 导出符号
        shell: pwsh
        run: |
          $exports = dumpbin /exports target/release/mambo_rvc_onnx.dll | Out-String
          $need = @('micyou_plugin_info','micyou_plugin_init','micyou_plugin_deinit',
                    'micyou_plugin_process','micyou_plugin_handle_event','micyou_plugin_handle_message')
          $missing = $need | Where-Object { $exports -notmatch $_ }
          if ($missing) { Write-Error "缺少导出符号: $missing"; exit 1 }
          Write-Host "ABI 导出符号齐全 ($($need.Count))"

      - name: 上传平台产物
        uses: actions/upload-artifact@v7
        with:
          name: plugin-dll
          path: target/release/mambo_rvc_onnx.dll

  # ── development 包（仅 push）：完整可安装的插件包 artifact ──
  dev-package:
    name: development 包（仅 push）
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: 下载构建产物
        uses: actions/download-artifact@v7
        with:
          name: plugin-dll
          path: stage

      - name: 下载版本化清单
        uses: actions/download-artifact@v7
        with:
          name: versioned-files
          path: versioned

      - name: 拉取资源包（resources Release：libs.zip + models.zip）
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 -o /tmp/libs.zip   "$RESOURCES_BASE/libs.zip"
          curl -fsSL --retry 5 --retry-delay 3 -o /tmp/models.zip "$RESOURCES_BASE/models.zip"
          ls -la /tmp/libs.zip /tmp/models.zip

      - name: 组装 + 校验（根即 plugin.json，可直接安装/导入）
        run: |
          set -euo pipefail
          VER="${{ needs.prepare.outputs.version }}"
          cp versioned/plugin.json stage/plugin.json
          cp panel.html README.md LICENSE stage/
          unzip -q /tmp/libs.zip   -d stage/    # → stage/libs/*.dll
          unzip -q /tmp/models.zip -d stage/    # → stage/models/*.onnx
          # 校验：3 dll + 3 onnx + 版本一致
          test "$(find stage/libs -name '*.dll' | wc -l)" -eq 3
          test -f stage/libs/onnxruntime.dll
          test -f stage/libs/onnxruntime_providers_cuda.dll
          test -f stage/libs/onnxruntime_providers_shared.dll
          test "$(find stage/models -name '*.onnx' | wc -l)" -eq 3
          test -f stage/models/hubert_base.onnx
          test -f stage/models/rmvpe.onnx
          test -f stage/models/uma-Matikane_Tannhauser.onnx
          test -f stage/mambo_rvc_onnx.dll
          python3 -c "import json,sys; v=json.load(open('stage/plugin.json'))['version']; sys.exit(0 if v=='$VER' else f'manifest {v} != $VER')"
          find stage -type f | sort && du -sh stage

      # artifact zip 的根即包内容（upload-artifact 会剥离公共父目录），
      # 下载后解压即得可直接导入的插件目录
      - name: 上传 development artifact
        uses: actions/upload-artifact@v7
        with:
          name: mambo-rvc-onnx-development
          path: stage
          retention-days: 14

  # ── 手动发布 Release（仅 workflow_dispatch）──
  release:
    name: 手动发布 Release
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v7
        with:
          name: plugin-dll
          path: stage

      - name: 下载版本化清单
        uses: actions/download-artifact@v7
        with:
          name: versioned-files
          path: versioned

      - name: 拉取资源包（resources Release：libs.zip + models.zip）
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 -o /tmp/libs.zip   "$RESOURCES_BASE/libs.zip"
          curl -fsSL --retry 5 --retry-delay 3 -o /tmp/models.zip "$RESOURCES_BASE/models.zip"
          ls -la /tmp/libs.zip /tmp/models.zip

      - name: 组装发布包（plugin.json 全通道同一份，downloadUrl 固定指向 latest）
        run: |
          set -euo pipefail
          VER="${{ needs.prepare.outputs.version }}"
          cp versioned/plugin.json plugin.json      # 工作区也换成版本化清单（回提交用）
          cp versioned/Cargo.toml  Cargo.toml
          cp plugin.json panel.html README.md LICENSE stage/
          unzip -q /tmp/libs.zip   -d stage/
          unzip -q /tmp/models.zip -d stage/
          test "$(find stage/libs -name '*.dll' | wc -l)" -eq 3
          test "$(find stage/models -name '*.onnx' | wc -l)" -eq 3
          test -f stage/mambo_rvc_onnx.dll
          # downloadUrl 不再按版本回写：仓库 plugin.json 固定指向
          # releases/latest/download/plugin.zip ⇒ zip 内 manifest == release 的
          # plugin.json 资产 == 手动市场 PR 所用文件，三者同一份
          python3 - "$VER" <<'PY'
          import json, sys
          ver = sys.argv[1]
          expect = "https://github.com/OrientCOMPASS/Mambo-RVC-ONNX/releases/latest/download/plugin.zip"
          m = json.load(open('stage/plugin.json', encoding='utf-8'))
          assert m['version'] == ver, f"manifest version {m['version']} != {ver}"
          assert m.get('downloadUrl') == expect, \
              f"plugin.json 的 downloadUrl 应为 {expect}，实际为 {m.get('downloadUrl')!r}"
          PY
          cp stage/plugin.json plugin.json          # release 资产与 zip 内完全同一份
          mkdir -p dist
          (cd stage && zip -q -r ../dist/plugin.zip .)
          ls -la dist/
          test "$(stat -c%s dist/plugin.zip)" -gt 500000000  # >500MB，资源没漏

      - name: 生成变更日志（自上一个 v* tag）
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -n "$LAST" ]; then git log --oneline "$LAST..HEAD" > /tmp/notes.md; else git log --oneline -20 > /tmp/notes.md; fi
          echo "" >> /tmp/notes.md
          echo "Windows x86_64 单包（主包固定名 plugin.zip，不带版本号；下载/更新统一走 releases/latest/download/plugin.zip）。包内含 ONNX Runtime（CUDA 12 构建）三件套与 3 个模型；" >> /tmp/notes.md
          echo "CUDA/cuDNN 的 19 个运行库不随包分发——启用插件后在 设置 → 曼波RVC 控制台 面板一键拉取（国内镜像 + 断点续传 + SHA256 校验）。" >> /tmp/notes.md
          echo "release 的 plugin.json 资产可直接用于向 MicYou-Plugins 提手动市场 PR。" >> /tmp/notes.md

      - name: bump 回提交到 main（[skip ci]）
        if: needs.prepare.outputs.bumped == 'true'
        run: |
          git add plugin.json Cargo.toml
          git commit -m "chore(release): bump version to ${{ needs.prepare.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: 打 tag 并发布 Release
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          git config user.name "mambo-rvc-ci"
          git config user.email "ci@users.noreply.github.com"
          git tag "v${VER}"
          git push origin "v${VER}"
          gh release create "v${VER}" dist/plugin.zip plugin.json \
            --title "v${VER}" --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
